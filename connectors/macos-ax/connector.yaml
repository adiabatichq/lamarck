manifestVersion: 1
id: lamarck.macos-ax
name: macOS AX Watcher
description: Captures privacy-filtered desktop context and presence from macOS Accessibility APIs.
eventCatalog: ./events.json
entry: ./index.mjs
runtime:
  mode: watch
source:
  identity: device
platforms:
  darwin:
    requirements:
      - macos-accessibility
auth:
  type: none
config:
  idle-threshold-seconds:
    type: number
    label: Idle threshold seconds
    default: 15
  afk-threshold-seconds:
    type: number
    label: AFK threshold seconds
    default: 60
configPanels:
  privacy-controls:
    label: Privacy Controls
    description: Configure app-level desktop capture policy
