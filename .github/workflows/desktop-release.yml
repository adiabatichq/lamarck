name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New stable version (x.y.z), for example 0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  LAMARCK_RELEASE_VERSION: ${{ inputs.version }}

jobs:
  build:
    if: github.repository == 'adiabatichq/lamarck' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    environment: r2-releases
    outputs:
      builder-image-id: ${{ steps.build.outputs.builder-image-id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Check existing production distribution prerequisites
        env:
          LAMARCK_DEVICE_IDENTITY_APPLE_POLICY_REVIEW: ${{ vars.LAMARCK_DEVICE_IDENTITY_APPLE_POLICY_REVIEW }}
          LAMARCK_DEVICE_IDENTITY_APPLE_DTS_REVIEW: ${{ vars.LAMARCK_DEVICE_IDENTITY_APPLE_DTS_REVIEW }}
          LAMARCK_DEVICE_IDENTITY_APPLE_LEGAL_REVIEW: ${{ vars.LAMARCK_DEVICE_IDENTITY_APPLE_LEGAL_REVIEW }}
        run: node --input-type=module -e 'import { requireAppleDeviceIdentityReviews } from "./scripts/package-macos-release-contract.mjs"; requireAppleDeviceIdentityReviews(process.env);'
      - name: Build sealed Shell export
        id: build
        env:
          LAMARCK_MARKETPLACE_SIGNING_KEY_ID: ${{ secrets.LAMARCK_MARKETPLACE_SIGNING_KEY_ID }}
          LAMARCK_MARKETPLACE_SIGNING_PUBLIC_KEY: ${{ secrets.LAMARCK_MARKETPLACE_SIGNING_PUBLIC_KEY }}
        run: |
          node scripts/build-macos-release-handoff.mjs "$RUNNER_TEMP/shell-handoff"
          tar -C "$RUNNER_TEMP/shell-handoff" -cf "$RUNNER_TEMP/shell-handoff.tar" export identity.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sealed-shell
          path: ${{ runner.temp }}/shell-handoff.tar
          retention-days: 3
          if-no-files-found: error
          compression-level: 0

  package:
    needs: build
    runs-on: macos-15
    timeout-minutes: 120
    environment: r2-releases
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sealed-shell
          path: ${{ runner.temp }}
      - name: Unpack same-run Shell export
        run: |
          mkdir "$RUNNER_TEMP/shell-handoff"
          tar -C "$RUNNER_TEMP/shell-handoff" -xf "$RUNNER_TEMP/shell-handoff.tar"
      - name: Fetch pinned Capsule Guest release
        env:
          RELEASES_PUBLIC_BASE: https://releases.lamarck.ai
        run: node scripts/fetch-guest-release.mjs
      - name: Prepare temporary signing keychain
        env:
          LAMARCK_CODESIGN_P12_BASE64: ${{ secrets.LAMARCK_CODESIGN_P12_BASE64 }}
          LAMARCK_CODESIGN_P12_PASSWORD: ${{ secrets.LAMARCK_CODESIGN_P12_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/ci-macos-signing.mjs setup
      - name: Sign, notarize and verify production application
        env:
          LAMARCK_SHELL_BUILD_HANDOFF: ${{ runner.temp }}/shell-handoff
          LAMARCK_SHELL_BUILDER_IMAGE_ID: ${{ needs.build.outputs.builder-image-id }}
          LAMARCK_MARKETPLACE_SIGNING_KEY_ID: ${{ secrets.LAMARCK_MARKETPLACE_SIGNING_KEY_ID }}
          LAMARCK_MARKETPLACE_SIGNING_PUBLIC_KEY: ${{ secrets.LAMARCK_MARKETPLACE_SIGNING_PUBLIC_KEY }}
          LAMARCK_DEVICE_IDENTITY_APPLE_POLICY_REVIEW: ${{ vars.LAMARCK_DEVICE_IDENTITY_APPLE_POLICY_REVIEW }}
          LAMARCK_DEVICE_IDENTITY_APPLE_DTS_REVIEW: ${{ vars.LAMARCK_DEVICE_IDENTITY_APPLE_DTS_REVIEW }}
          LAMARCK_DEVICE_IDENTITY_APPLE_LEGAL_REVIEW: ${{ vars.LAMARCK_DEVICE_IDENTITY_APPLE_LEGAL_REVIEW }}
        run: |
          npm run package:macos
          node scripts/stage-desktop-handoff.mjs .lamarck/release/macos "$RUNNER_TEMP/desktop-package"
      - name: Remove signing credentials
        if: always()
        run: node scripts/ci-macos-signing.mjs cleanup
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-package
          path: ${{ runner.temp }}/desktop-package/
          retention-days: 3
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: r2-releases
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Verify release publication contract
        run: node --test scripts/r2-object-store.test.mjs scripts/desktop-release.test.mjs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-package
          path: ${{ runner.temp }}/desktop-package/
      - name: Publish verified ZIP and stable update feed
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
          R2_RELEASES_BUCKET: ${{ vars.R2_RELEASES_BUCKET || 'lamarck-desktop-releases-prod' }}
        run: node scripts/publish-desktop.mjs "$RUNNER_TEMP/desktop-package"
