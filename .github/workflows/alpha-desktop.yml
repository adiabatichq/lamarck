name: Alpha Desktop

# Transition-period alpha channel: assembles an ad-hoc signed desktop build
# against the pinned Capsule Guest release and publishes it to the R2 alpha
# channel. Retire the ad-hoc path once Developer ID signing lands.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional full version, for example 0.1.0-alpha.12
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: alpha-desktop
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'adiabatichq/lamarck' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Install dependencies
        run: npm ci --audit=false --fund=false

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Fetch pinned Capsule Guest release
        env:
          RELEASES_PUBLIC_BASE: ${{ vars.RELEASES_PUBLIC_BASE || 'https://releases.lamarck.ai' }}
        run: node scripts/fetch-guest-release.mjs

      - name: Build Capsule VM helper
        run: npm run capsule-vm:build:macos

      - name: Stage Capsule native resources
        run: npm run capsule-guest:stage

      - name: Package alpha build
        env:
          ALPHA_VERSION: ${{ inputs.version }}
          LAMARCK_MARKETPLACE_SIGNING_KEY_ID: ${{ vars.LAMARCK_MARKETPLACE_SIGNING_KEY_ID }}
          LAMARCK_MARKETPLACE_SIGNING_PUBLIC_KEY: ${{ vars.LAMARCK_MARKETPLACE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if test -n "$ALPHA_VERSION"; then
            npm run package:macos:alpha -- --version "$ALPHA_VERSION"
          else
            npm run package:macos:alpha
          fi

      - name: Stage package artifact
        run: node scripts/stage-alpha-handoff.mjs

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alpha-package
          path: release-handoff/alpha/
          retention-days: 3
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: package
    if: github.repository == 'adiabatichq/lamarck'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: r2-releases

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Verify R2 release client
        run: node --test scripts/r2-object-store.test.mjs

      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: alpha-package
          path: release-handoff/alpha/

      - name: Publish to R2 alpha channel
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
          R2_RELEASES_BUCKET: ${{ vars.R2_RELEASES_BUCKET || 'lamarck-desktop-releases-prod' }}
          RELEASES_PUBLIC_BASE: ${{ vars.RELEASES_PUBLIC_BASE || 'https://releases.lamarck.ai' }}
        run: node scripts/publish-alpha.mjs --dir release-handoff/alpha
