name: Publish CLI

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'adiabatichq/lamarck' && startsWith(github.event.release.tag_name, 'cli-v')
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Install dependencies
        run: npm ci --workspace @lamarck/cli --include-workspace-root=false --ignore-scripts --audit=false --fund=false

      - name: Verify CLI
        run: |
          npm --workspace @lamarck/cli run typecheck
          npm --workspace @lamarck/cli test

      - name: Build and verify release tarball
        run: node scripts/pack-cli.mjs --verify-release

      - name: Check immutable registry version
        id: registry
        run: node scripts/check-cli-registry.mjs

      - name: Publish with npm trusted publishing
        if: steps.registry.outputs.published != 'true'
        run: npm publish .lamarck/build/cli/lamarck-cli.tgz --access public --tag latest --provenance

      - name: Verify published registry bytes
        run: node scripts/check-cli-registry.mjs --wait
