name: Publish Official Marketplace Packages

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "connectors/**"
      - ".github/workflows/publish-marketplace.yml"
      - "scripts/publish-marketplace-package.mjs"
  workflow_dispatch:
    inputs:
      changelog:
        description: Optional changelog applied to each package in this retry
        required: false
        type: string

permissions: {}

concurrency:
  group: official-marketplace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    if: github.repository == 'adiabatichq/lamarck' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Discover immediate official package directories
        id: packages
        run: node scripts/publish-marketplace-package.mjs discover

  publish:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: marketplace-official
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      MARKETPLACE_API_ORIGIN: ${{ vars.MARKETPLACE_API_ORIGIN }}
      MARKETPLACE_OIDC_AUDIENCE: ${{ vars.MARKETPLACE_OIDC_AUDIENCE }}
      MARKETPLACE_CHANGELOG: ${{ inputs.changelog }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Upload opaque candidate and wait for publication
        run: >-
          node scripts/publish-marketplace-package.mjs publish
          "${{ matrix.kind }}"
          "${{ matrix.directory }}"
