manifestVersion: 1
id: telegram-bot
name: Telegram Bot
description: Captures inbound Telegram messages received by a configured bot.
eventCatalog: ./events.json
entry: ./index.mjs
runtime:
  mode: watch
source:
  identity: connector
platforms:
  darwin: {}
  linux: {}
  windows: {}
  cloud: {}
auth:
  type: apiKey
  label: Telegram bot token
config:
  poll-timeout-sec:
    type: number
    label: Poll timeout seconds
    default: 25
  clear-webhook-on-start:
    type: boolean
    label: Clear webhook on start
    default: false
configPanels:
  telegram-setup:
    label: Telegram Setup
    description: Pair users and configure message capture
