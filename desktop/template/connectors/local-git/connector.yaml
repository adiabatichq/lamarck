manifestVersion: 1
id: local-git
name: Local Git
description: Collects unique Git commits matching configured identities from user-selected local repositories as durable evidence for reconstructing coding work.
eventCatalog: ./events.json
entry: ./index.mjs
runtime:
  mode: watch
source:
  identity: device
platforms:
  darwin: {}
  linux: {}
  windows: {}
auth:
  type: none
configPanels:
  setup:
    label: Setup
    description: Configure code roots, work identities, and evidence capture policy
